<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebPage Summariser</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>WebPage Summariser</h1>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="summary">Summary</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <!-- Summary Tab -->
    <div id="summary" class="tab-content active">
      <div id="status" class="status idle">Ready to summarise</div>
      <button id="summariseBtn" class="primary-btn">Summarise This Page</button>
      <div id="results" class="results"></div>
    </div>

    <!-- Settings Tab -->
    <div id="settings" class="tab-content">
      <div class="settings-form">
        <label for="profileSelect">Your Profile:</label>
        <select id="profileSelect">
          <option value="engineer">Software Engineer</option>
          <option value="lawyer">Lawyer</option>
          <option value="doctor">Doctor</option>
          <option value="student">Student</option>
          <option value="product-manager">Product Manager</option>
          <option value="designer">Designer</option>
          <option value="data-scientist">Data Scientist</option>
          <option value="marketer">Marketer</option>
          <option value="financial-analyst">Financial Analyst</option>
          <option value="teacher">Teacher</option>
          <option value="journalist">Journalist</option>
          <option value="entrepreneur">Entrepreneur</option>
          <option value="other">Other (custom)</option>
        </select>

        <div id="customProfileDiv" style="display: none;">
          <label for="customProfile">Describe your background:</label>
          <textarea id="customProfile" placeholder="e.g., Architect, Nurse, Chef, etc."></textarea>
        </div>

        <div class="settings-feedback" id="settingsFeedback"></div>
      </div>
    </div>
  </div>

  <!-- Load as ES module for @litert-lm/core support -->
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
